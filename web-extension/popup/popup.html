<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <span class="icon">🔒</span>
      <h2>ZenGram</h2>
    </div>
    <span class="status-badge">Active</span>
  </div>

  <p class="subtitle">Distraction-Free Instagram Chat</p>

  <div class="features-list">
    <div class="feature-item">
      <span>✉️ Direct Messages</span>
      <span class="badge on">Strict Only</span>
    </div>
    <div class="feature-item">
      <span>🚫 Feed & Explore</span>
      <span class="badge blocked">Blocked</span>
    </div>
    <div class="feature-item">
      <span>🎬 Reels Feed</span>
      <span class="badge blocked">Blocked</span>
    </div>
    <div class="feature-item">
      <span>📱 Reels in Chat</span>
      <span class="badge on">Sandboxed</span>
    </div>
    <div class="feature-item">
      <span>📞 Voice & Video Calls</span>
      <span class="badge on">Enabled</span>
    </div>
    <div class="feature-item">
      <span>⭕ Stories</span>
      <span class="badge on">Chat / Search Only</span>
    </div>
  </div>

  <div class="action-btn-group">
    <button id="btn-open-inbox" class="btn-primary">Open Instagram DMs</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
